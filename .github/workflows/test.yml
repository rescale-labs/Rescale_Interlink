name: Test Rescale Interlink

on:
  push:
    branches:
      - "release/**"
  pull_request:

permissions:
  contents: read

env:
  # Run the Go installed and checked below, or fail; never fetch another one.
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

# The Linux and Windows jobs leave out the root package: it embeds
# frontend/dist, which is not in the repository, and it has no tests. Each then
# reruns, verbosely, the tests that only mean something on its platform and
# fails unless each passed. That check runs after a failure elsewhere too, so
# every run reports on them. So does the Go cache save, which a plain
# actions/cache step skips on failure.
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Go 1.26.7
        run: |
          curl -fL -o go1.26.7.linux-amd64.tar.gz https://go.dev/dl/go1.26.7.linux-amd64.tar.gz
          # Official sha256 from https://go.dev/dl/?mode=json&include=all
          echo "ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca  go1.26.7.linux-amd64.tar.gz" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.26.7.linux-amd64.tar.gz
          rm go1.26.7.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Restore Go modules and build output
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go1.26.7-linux-${{ hashFiles('go.sum') }}

      # internal/wailsapp builds here without WebKitGTK: the only C it pulls in
      # is wails' signal reset, which needs libc headers alone (-race requires cgo).
      - name: Run Go tests
        run: |
          go list -e ./... |
            grep -v -x -F github.com/rescale/rescale-int |
            GOFIPS140=certified xargs go test -tags fips -count=1 -race

      - name: Check the Linux-only tests ran
        if: ${{ !cancelled() }}
        env:
          # package:test for piddomain_linux_test.go, and the test that reads
          # this machine's own identifier and PID namespace.
          PLATFORM_TESTS: >-
            ./internal/cloud/state:TestReadPIDDomain_TellsTwoNamespacesOfOneMachineApart
            ./internal/cloud/state:TestReadPIDDomain_WithoutTheParts
            ./internal/cloud/state:TestReadPIDDomain_RefusesAMachineIDThatIsNotOne
            ./internal/cloud/state:TestReadPIDDomain_PassesAnInvalidMachineIDForTheFallback
            ./internal/cloud/state:TestReadPIDDomain_FallsBackToTheSecondMachineIDFile
            ./internal/cloud/state:TestReadPIDDomain_TheSystemNamesOneAndGoesOnNamingIt
        run: |
          # Each package runs once, verbosely; each of its listed tests must pass.
          names=$(for pt in $PLATFORM_TESTS; do printf '%s|' "${pt#*:}"; done)
          pkgs=$(for pt in $PLATFORM_TESTS; do echo "${pt%%:*}"; done | sort -u)
          for pkg in $pkgs; do
            GOFIPS140=certified go test -tags fips -count=1 -race -v -run "^(${names%|})\$" "$pkg" | tee test.log
            for pt in $PLATFORM_TESTS; do
              [ "${pt%%:*}" = "$pkg" ] || continue
              grep -q -F -- "--- PASS: ${pt#*:} (" test.log || { echo "::error::$pt did not run and pass"; exit 1; }
            done
          done

      - name: Save Go modules and build output
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Go 1.26.7
        shell: pwsh
        run: |
          curl.exe -fL -o go1.26.7.windows-amd64.zip https://go.dev/dl/go1.26.7.windows-amd64.zip
          # Official sha256 from https://go.dev/dl/?mode=json&include=all
          $sha256 = (Get-FileHash go1.26.7.windows-amd64.zip -Algorithm SHA256).Hash
          if ($sha256 -ne "f4f534a486e4bc3387fa18f08208f2f854b7aaea8a08f2a2d829a914a05abb11") {
            throw "go1.26.7.windows-amd64.zip has sha256 $sha256"
          }
          Expand-Archive go1.26.7.windows-amd64.zip -DestinationPath $env:RUNNER_TEMP
          Remove-Item go1.26.7.windows-amd64.zip
          "$env:RUNNER_TEMP\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore Go modules and build output
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go1.26.7-windows-${{ hashFiles('go.sum') }}

      - name: Run Go tests
        run: |
          go list -e ./... |
            grep -v -x -F github.com/rescale/rescale-int |
            GOFIPS140=certified xargs go test -tags fips -count=1

      - name: Check the Windows-only tests ran
        if: ${{ !cancelled() }}
        env:
          # package:test for the Windows-only exited-child test; the tests that
          # reach piddomain_windows.go and, for a live PID, liveness_windows.go;
          # the Windows-only tests of the retired service, the per-user pipes,
          # the tray and drive-relative scan roots; and the tests that reach the
          # Windows process checks of 'daemon stop --force'.
          PLATFORM_TESTS: >-
            ./cmd/rescale-int-tray:TestStartRefusalsAreShown
            ./cmd/rescale-int-tray:TestStartupStartsOnlyWhenEnabledAndShowsWhy
            ./cmd/rescale-int-tray:TestStartupWaitsForTheDownloadFolder
            ./internal/cloud/state:TestWindowsOpenProcessLiveness
            ./internal/cloud/state:TestProbeProcessLiveness_AnswersAboutThisProcess
            ./internal/cloud/state:TestProbeProcessLiveness_AnExitedChildStillHeldOpenIsDead
            ./internal/cloud/state:TestReadPIDDomain_TheSystemNamesOneAndGoesOnNamingIt
            ./internal/daemon:TestKillDaemon_EndsOnlyThisUsersDaemon
            ./internal/daemon:TestProcessInfo_ReadsAnotherProcesssCommandLine
            ./internal/ipc:TestDialUserPipe_RefusesAnotherUsersPipe
            ./internal/ipc:TestListenUserPipe_DoesNotJoinAnExistingPipe
            ./internal/ipc:TestNoSID_NoPipe
            ./internal/ipc:TestPipeOwnedByAnotherUser
            ./internal/ipc:TestServer_ListensOnThisUsersPipe
            ./internal/ratelimit/coordinator:TestEnsureCoordinator_NoProfileNoSpawn
            ./internal/ratelimit/coordinator:TestListen_ServesThisUsersClient
            ./internal/ratelimit/coordinator:TestSocketPath_OnePerUser
            ./internal/service:TestBlockSubprocess_SaysHowToStopTheRunningDaemon
            ./internal/service:TestServiceStateDecidesBlocking
            ./internal/service:TestRetiredServiceReportsRunningThenStops
            ./internal/service:TestUninstallWithoutTheServiceSucceeds
            ./internal/util/multipart:TestScanDirectories_DriveRelativeRoots
            ./internal/wailsapp:TestStartDaemonSaysWhyItCannotStart
        run: |
          # Each package runs once, verbosely; each of its listed tests must pass.
          names=$(for pt in $PLATFORM_TESTS; do printf '%s|' "${pt#*:}"; done)
          pkgs=$(for pt in $PLATFORM_TESTS; do echo "${pt%%:*}"; done | sort -u)
          for pkg in $pkgs; do
            GOFIPS140=certified go test -tags fips -count=1 -v -run "^(${names%|})\$" "$pkg" | tee test.log
            for pt in $PLATFORM_TESTS; do
              [ "${pt%%:*}" = "$pkg" ] || continue
              grep -q -F -- "--- PASS: ${pt#*:} (" test.log || { echo "::error::$pt did not run and pass"; exit 1; }
            done
          done

      - name: Save Go modules and build output
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # release.yml's verify job less the Go tests, which the jobs above run: the
  # frontend's tests, lint and build, then go vet, which needs that build for
  # the root package. On macOS as there, since on Linux the root package would
  # need the WebKitGTK headers.
  frontend-and-vet:
    name: Frontend and go vet
    runs-on: macos-14  # Apple Silicon (M1) runner
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Go 1.26.7
        run: |
          curl -fL -o go1.26.7.darwin-arm64.tar.gz https://go.dev/dl/go1.26.7.darwin-arm64.tar.gz
          # Official sha256 from https://go.dev/dl/?mode=json&include=all
          echo "020a1e8224811be75163e920bc77e0926a1390a6aeea19bdcf23f74b9d749f6d  go1.26.7.darwin-arm64.tar.gz" | shasum -a 256 -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.26.7.darwin-arm64.tar.gz
          rm go1.26.7.darwin-arm64.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.21.0'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:run
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Vet Go sources
        run: GOFIPS140=certified go vet -tags fips ./...
