name: Test Rescale Interlink

on:
  push:
    branches:
      - "release/**"
  pull_request:

permissions:
  contents: read

env:
  # Run the Go installed and checked below, or fail; never fetch another one.
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

# Both jobs leave out the root package: it embeds frontend/dist, which is not
# in the repository, and it has no tests. Each job then reruns, verbosely, the
# tests that only mean something on its platform and fails unless each passed.
# That check runs after a failure elsewhere too, so every run reports on them.
# So does the Go cache save, which a plain actions/cache step skips on failure.
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Go 1.26.7
        run: |
          curl -fL -o go1.26.7.linux-amd64.tar.gz https://go.dev/dl/go1.26.7.linux-amd64.tar.gz
          # Official sha256 from https://go.dev/dl/?mode=json&include=all
          echo "ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca  go1.26.7.linux-amd64.tar.gz" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.26.7.linux-amd64.tar.gz
          rm go1.26.7.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Restore Go modules and build output
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go1.26.7-linux-${{ hashFiles('go.sum') }}

      # internal/wailsapp builds here without WebKitGTK: the only C it pulls in
      # is wails' signal reset, which needs libc headers alone (-race requires cgo).
      - name: Run Go tests
        run: |
          go list -e ./... |
            grep -v -x -F github.com/rescale/rescale-int |
            GOFIPS140=certified xargs go test -tags fips -count=1 -race

      - name: Check the Linux-only tests ran
        if: ${{ !cancelled() }}
        env:
          # piddomain_linux_test.go, and the test that reads this machine's own
          # identifier and PID namespace.
          PLATFORM_TESTS: >-
            TestReadPIDDomain_TellsTwoNamespacesOfOneMachineApart
            TestReadPIDDomain_WithoutTheParts
            TestReadPIDDomain_RefusesAMachineIDThatIsNotOne
            TestReadPIDDomain_PassesAnInvalidMachineIDForTheFallback
            TestReadPIDDomain_FallsBackToTheSecondMachineIDFile
            TestReadPIDDomain_TheSystemNamesOneAndGoesOnNamingIt
        run: |
          GOFIPS140=certified go test -tags fips -count=1 -race -v -run "^(${PLATFORM_TESTS// /|})\$" ./internal/cloud/state | tee state.log
          for test in $PLATFORM_TESTS; do
            grep -q -F -- "--- PASS: $test (" state.log || { echo "::error::$test did not run and pass"; exit 1; }
          done

      - name: Save Go modules and build output
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Go 1.26.7
        shell: pwsh
        run: |
          curl.exe -fL -o go1.26.7.windows-amd64.zip https://go.dev/dl/go1.26.7.windows-amd64.zip
          # Official sha256 from https://go.dev/dl/?mode=json&include=all
          $sha256 = (Get-FileHash go1.26.7.windows-amd64.zip -Algorithm SHA256).Hash
          if ($sha256 -ne "f4f534a486e4bc3387fa18f08208f2f854b7aaea8a08f2a2d829a914a05abb11") {
            throw "go1.26.7.windows-amd64.zip has sha256 $sha256"
          }
          Expand-Archive go1.26.7.windows-amd64.zip -DestinationPath $env:RUNNER_TEMP
          Remove-Item go1.26.7.windows-amd64.zip
          "$env:RUNNER_TEMP\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore Go modules and build output
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go1.26.7-windows-${{ hashFiles('go.sum') }}

      - name: Run Go tests
        run: |
          go list -e ./... |
            grep -v -x -F github.com/rescale/rescale-int |
            GOFIPS140=certified xargs go test -tags fips -count=1

      - name: Check the Windows liveness tests ran
        if: ${{ !cancelled() }}
        env:
          # The Windows-only exited-child test, and the tests that reach
          # piddomain_windows.go and, for a live PID, liveness_windows.go.
          PLATFORM_TESTS: >-
            TestWindowsOpenProcessLiveness
            TestProbeProcessLiveness_AnswersAboutThisProcess
            TestProbeProcessLiveness_AnExitedChildStillHeldOpenIsDead
            TestReadPIDDomain_TheSystemNamesOneAndGoesOnNamingIt
        run: |
          GOFIPS140=certified go test -tags fips -count=1 -v -run "^(${PLATFORM_TESTS// /|})\$" ./internal/cloud/state | tee state.log
          for test in $PLATFORM_TESTS; do
            grep -q -F -- "--- PASS: $test (" state.log || { echo "::error::$test did not run and pass"; exit 1; }
          done

      - name: Save Go modules and build output
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
